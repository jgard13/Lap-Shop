<article class="card" [class.added]="added" (click)="goToDetail()" style="cursor:pointer">

  <!-- Botón de favorito en esquina superior derecha -->
  <button
    class="btn-fav"
    [class.active]="esFavorito"
    (click)="onToggleFavorito($event)"
    [title]="esFavorito ? 'Quitar de favoritos' : 'Agregar a favoritos'"
    aria-label="Favorito"
  >
    <span class="material-icons">{{ esFavorito ? 'favorite' : 'favorite_border' }}</span>
  </button>

  <img class="img" [src]="product.imageUrl" [alt]="product.name" />

  <div class="body">
    <div class="top">
      <h3 class="title">{{ product.name }}</h3>
      <span class="price">$ {{ product.price }}</span>
    </div>

    <p class="meta">{{ product.category }}</p>
    <p class="desc">{{ product.description }}</p>

    <p class="stock" [class.out]="!product.inStock">
      @if (product.inStock) { En stock } @else { Agotado }
    </p>

    <button class="btn" [disabled]="!product.inStock" (click)="onAdd($event)">
      Agregar al carrito
    </button>
  </div>
</article>
