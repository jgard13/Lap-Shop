<section class="cart">
  <div class="cart-header">
    <h2 class="title">Carrito</h2>
    <button class="close" (click)="onClose()">✕</button>
  </div>

  <div *ngIf="carrito().length === 0" class="cart-empty">
    <span class="empty-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="empty-cart-svg">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
    </span>
    <p class="empty">Tu carrito está vacío.</p>
  </div>

  <div *ngIf="carrito().length > 0">
    <ul class="list">
      <li class="item" *ngFor="let item of carrito()">
        <!-- Badge de cantidad -->
        <div class="qty-badge">{{ item.quantity }}</div>

        <!-- Info del producto -->
        <div class="item-info">
          <span class="item-name">{{ item.product.name }}</span>
          <span class="item-subtotal">{{ (item.product.price * item.quantity) | currency:'MXN':'symbol-narrow':'1.0-0' }}</span>
        </div>

        <!-- Controles -->
        <div class="item-controls">
          <button class="ctrl-btn add" (click)="agregar(item.product)" title="Agregar uno más">+</button>
          <button class="ctrl-btn remove" (click)="quitar(item.product.id)" title="Quitar uno">−</button>
        </div>
      </li>
    </ul>

    <div class="cart-footer">
      <div class="total-row">
        <span>Total</span>
        <span class="total-amount">{{ total() | currency:'MXN':'symbol-narrow':'1.0-0' }}</span>
      </div>

      <div class="actions">
        <button class="btn-vaciar" (click)="vaciar()">Vaciar carrito</button>
      </div>

      <div class="checkout-container">
        <button class="btn-checkout" (click)="irACheckout()">Proceder al Pago</button>
      </div>
    </div>
  </div>
</section>
